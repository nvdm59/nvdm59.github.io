<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navid Mehrdad</title>
<meta name="description" content="Navid Mehrdad — engineer and writer.">
<style>
  :root {
    --paper: #F6F6F3;
    --ink: #1E2422;
    --muted: #5C6662;
    --accent: #2E6B60;
    --hairline: #D8DBD6;
    --hover-bg: #ECEEE9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151A18;
      --ink: #E6E9E5;
      --muted: #97A19B;
      --accent: #7CBCAD;
      --hairline: #2A322E;
      --hover-bg: #1D2421;
    }
  }

  html { background: var(--paper); }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Charter", "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page {
    max-width: 34rem;
    padding: 3rem 1.5rem;
    text-align: center;
  }

  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 2.5rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0 0 0.5rem;
  }
  .role {
    color: var(--muted);
    margin: 0;
  }

  /* signal rule: dash pattern, a nod to channels */
  .signal {
    margin: 1.75rem auto;
    max-width: 16rem;
    height: 1px;
    background: repeating-linear-gradient(
      90deg,
      var(--accent) 0 14px,
      transparent 14px 20px,
      var(--accent) 20px 24px,
      transparent 24px 34px
    );
    opacity: 0.75;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
    padding: 0;
    margin: 0;
    list-style: none;
  }
  .links a {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 0.8125rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 0.45rem 0.95rem;
    transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
  }
  .links a:hover {
    border-color: var(--accent);
    background: var(--hover-bg);
    color: var(--accent);
  }
  .links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .links .at { color: var(--muted); }
  .links a:hover .at { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main class="page">
  <h1>Navid Mehrdad</h1>
  <p class="role">Engineer &amp; writer — San Francisco Bay Area</p>

  <div class="signal" role="presentation"></div>

  <ul class="links">
    <li><a href="mailto:navid@alumni.stanford.edu"><span class="at">mail/</span>navid@alumni.stanford.edu</a></li>
    <li><a href="https://www.linkedin.com/in/navid-mehrdad"><span class="at">linkedin/</span>navid-mehrdad</a></li>
    <li><a href="https://x.com/navidmehrdad59"><span class="at">x.com/</span>navidmehrdad59</a></li>
    <li><a href="https://substack.com/@navidmehrdad"><span class="at">substack/</span>@navidmehrdad</a></li>
  </ul>
</main>

</body>
</html>
